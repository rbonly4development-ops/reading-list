name: Hello Actions

on:
  push:
    branches: main
    paths-ignore:
      - 'README.md'

  pull_request:
    branches: main
    
  workflow_dispatch:
    inputs:
      greeting_name:
        description: 'Name to include in the greeting'
        required: false
        default: 'World'

  schedule:
    - cron: '35 12 * * *'

env:
  SITE_NAME: Reading List

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello, ${{ github.event.inputs.greeting_name || 'World' }}! This run was triggered by a ${{ github.event_name }} event."

      - name: Show the operating system
        run: cat /etc/os-release

      - name: List files (before checkout)
        run: |
          pwd
          ls -la

      - name: Check out the repository
        uses: actions/checkout@v6

      - name: List files (after checkout)
        run: ls -la

      - name: Show Run Context
        run: |
          echo "### Run Context" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|">> "$GITHUB_STEP_SUMMARY"
          echo "| Event | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ref | ${{ github.ref_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run Number | ${{ github.run_number }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner OS | ${{ runner.os  }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Site Name (Expression) | ${{ env.SITE_NAME}} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Site Name (Shell Variable) | $SITE_NAME |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy Enabled | ${{ vars.DEPLOY_ENABLED }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Site Label | ${{ vars.SITE_LABEL}} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Print the secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: echo "The secret is $DEMO_SECRET"

      - name: Print a transformed copy
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: echo "$DEMO_SECRET" | sed 's/./& /g'
      
      - name: Print the secret directly
        run: echo "The secret is ${{ secrets.DEMO_SECRET }}"
      
      - name: Check the deploy token
        env: 
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then STATE=set; else STATE=empty; fi
          echo "- DEPLOY_TOKEN is $STATE" >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: 
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
        exclude:
          - os: windows-latest
            python-version: '3.11'
        include:
          - os: ubuntu-latest
            python-version: '3.14'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
      
      - name: Show where it failed
        if: failure()
        run: echo "Tests failed on ${{ matrix.os }} with Python ${{ matrix.python-version }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .
    
  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      - name: Restore cached site
        id: site-cache
        uses: actions/cache@v6
        with:
          path: site/
          key: site-${{ hashFiles('books.json', 'reading_list.py') }}
      
      - name: Build the site
        if: steps.site-cache.outputs.cache-hit != 'true'
        run: python reading_list.py

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: reading-list-site
          path: site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/
  
  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: show staging config
        run: echo "- staging uses SITE_LABEL = ${{ vars.SITE_LABEL }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the deploy token
        env: 
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then STATE=set; else STATE=empty; fi
          echo "- DEPLOY_TOKEN is $STATE" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [build, staging]
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Show deployment config
        run: echo "- deploy uses SITE_LABEL = ${{ vars.SITE_LABEL }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the deploy token
        env: 
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then STATE=set; else STATE=empty; fi
          echo "- DEPLOY_TOKEN is $STATE" >> "$GITHUB_STEP_SUMMARY"        

      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v5

  report:
    needs: [test, lint, build, staging, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: 
      issues: write
    steps:
      - name: Write results to the job summary
        run: |
          echo "### Job Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| test | ${{ needs.test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| lint | ${{ needs.lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| build | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| staging | ${{ needs.staging.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| deploy | ${{ needs.deploy.result }} |" >> "$GITHUB_STEP_SUMMARY"
      
      - name: Open an issue when tests fail
        if: needs.test.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh issue create --title "Tests failed on ${{ github.ref_name }}" --body "Run ${{ github.run_number }} failed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
