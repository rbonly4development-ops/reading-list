name: Hello Actions

on:
  push:
    branches: main
    tags: ['v*']
    paths-ignore:
      - 'README.md'

  pull_request:
    branches: main
    
  workflow_dispatch:
    inputs:
      greeting_name:
        description: 'Name to include in the greeting'
        required: false
        default: 'World'

  schedule:
    - cron: '30 12 * * *'

env:
  SITE_NAME: Reading List

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello, ${{ github.event.inputs.greeting_name || 'World' }}! This run was triggered by a ${{ github.event_name }} event."

      - name: Show the operating system
        run: cat /etc/os-release

      - name: List files (before checkout)
        run: |
          pwd
          ls -la

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: List files (after checkout)
        run: ls -la

      - name: Show Run Context
        run: |
          {
            echo "### Run Context"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Event | ${{ github.event_name }} |"
            echo "| Ref | ${{ github.ref_name }} |"
            echo "| Actor | ${{ github.actor }} |"
            echo "| Run Number | ${{ github.run_number }} |"
            echo "| Runner OS | ${{ runner.os  }} |"
            echo "| Site Name (Expression) | ${{ env.SITE_NAME}} |"
            echo "| Site Name (Shell Variable) | $SITE_NAME |"
            echo "| Deploy Enabled | ${{ vars.DEPLOY_ENABLED }} |"
            echo "| Site Label | ${{ vars.SITE_LABEL}} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Print the secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: echo "The secret is $DEMO_SECRET"
      
      - name: Print the secret directly
        run: echo "The secret is ${{ secrets.DEMO_SECRET }}"
      
      - name: Check the deploy token
        env: 
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then STATE="set"; else STATE="empty"; fi
          echo "- DEPLOY_TOKEN is $STATE" >> "$GITHUB_STEP_SUMMARY"
      
      - name: Announce the pull request
        if: github.event_name == 'pull_request'
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "New pull request $PR_TITLE"

  test:
    uses: ./.github/workflows/test.yml
    with:
      fail-fast: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python and dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.12'

      - name: Lint
        run: ruff check .
      
      - name: Lint the workflows
        run: actionlint
    
  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.measure.outputs.files }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      - name: Restore cached site
        id: site-cache
        uses: actions/cache@v6
        with:
          path: site/
          key: site-${{ hashFiles('books.json', 'reading_list.py') }}
      
      - name: Build the site
        if: steps.site-cache.outputs.cache-hit != 'true'
        run: python reading_list.py

      - name: Measure the site
        id: measure
        run: echo "files=$(find site -type f | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: reading-list-site
          path: site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/
  
  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: show staging config
        run: echo "- staging uses SITE_LABEL = ${{ vars.SITE_LABEL }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the deploy token
        env: 
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then STATE="set"; else STATE="empty"; fi
          echo "- DEPLOY_TOKEN is $STATE" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [build, staging]
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Show deployment config
        run: echo "- deploy uses SITE_LABEL = ${{ vars.SITE_LABEL }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the deploy token
        env: 
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then STATE="set"; else STATE="empty"; fi
          echo "- DEPLOY_TOKEN is $STATE" >> "$GITHUB_STEP_SUMMARY"        

      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v5

  report:
    needs: [test, lint, build, staging, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: 
      issues: write
    steps:
      - name: Write results to the job summary
        run: |
          {
            echo "### Job Results"
            echo "| Job | Status |"
            echo "|---|---|"
            echo "| test | ${{ needs.test.result }} |"
            echo "| lint | ${{ needs.lint.result }} |"
            echo "| build | ${{ needs.build.result }} |" 
            echo "| staging | ${{ needs.staging.result }} |"
            echo "| deploy | ${{ needs.deploy.result }} |" 
            echo "| site files | ${{ needs.build.outputs.files }} |" 
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue when tests fail
        if: needs.test.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh issue create --title "Tests failed on ${{ github.ref_name }}" --body "Run ${{ github.run_number }} failed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
