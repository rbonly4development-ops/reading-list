name: Hello Actions

on:
  push:
    branches: main
    paths-ignore:
      - 'README.md'
  
  pull_request:
    branches: main
    
  workflow_dispatch:
    inputs:
      greeting_name:
        description: 'Name to include in the greeting'
        required: false
        default: 'World'

  schedule:
    - cron: '35 12 * * *'


jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello, ${{ github.event.inputs.greeting_name || 'World' }}! This run was triggered by a ${{ github.event_name }} event."

      - name: Show the operating system
        run: cat /etc/os-release

      - name: List files (before checkout)
        run: |
          pwd
          ls -la

      - name: Check out the repository
        uses: actions/checkout@v6

      - name: List files (after checkout)
        run: ls -la

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: 
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .
    
  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build the site
        run: python reading_list.py

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: reading-list-site
          path: site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/
  
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v5