   name: Tests

   on:
     workflow_call:
       inputs:
         fail-fast:
           description: Stop all matrix legs when one fails
           type: boolean
           default: false
     workflow_dispatch:
       inputs:
         fail-fast:
           description: Stop all matrix legs when one fails
           type: boolean
           default: false

   permissions:
     contents: read

   jobs:
     test:
       runs-on: ${{ matrix.os }}
       strategy:
         fail-fast: ${{ inputs.fail-fast }}
         matrix:
           os: [ubuntu-latest, windows-latest, macos-latest]
           python-version: ['3.11', '3.12', '3.13']
           exclude:
             - os: windows-latest
               python-version: '3.11'
           include:
             - os: ubuntu-latest
               python-version: '3.14'
       steps:
         - name: Check out the repository
           uses: actions/checkout@v7
         - name: Set up Python and dependencies
           uses: ./.github/actions/setup-python-deps
           with:
             python-version: ${{ matrix.python-version }}
         - name: Run tests
           run: python -m pytest
         - name: Show where it failed
           if: failure()
           run: echo "Tests failed on ${{ matrix.os }} with Python ${{ matrix.python-version }}"